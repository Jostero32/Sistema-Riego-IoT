# Sistema de riego IoT: dashboard Next.js + broker MQTT + backend Spring Boot + MongoDB.
#
#   cp .env.example .env   (opcional: puertos y credenciales)
#   docker compose up -d --build
#
#   Dashboard:           http://localhost:3000
#   API REST + Swagger:  http://localhost:8080/swagger-ui.html
#   WebSocket (STOMP):   ws://localhost:8080/ws
#   MQTT (para el ESP32): <IP-del-PC>:1883
#   mongo-express:       http://localhost:8081

services:
  frontend:
    build:
      context: ./frontend
      args:
        # URL del backend tal como la ve el navegador
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    container_name: iot-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: iot-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      MQTT_BROKER_URL: tcp://mosquitto:1883
      SPRING_MONGODB_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-secret}@mongodb:27017/iot_db?authSource=admin
    depends_on:
      - mosquitto
      - mongodb
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      # Abierto en la red local: el ESP32 publica aquí.
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret}
      MONGO_INITDB_DATABASE: iot_db
    volumes:
      - mongo_data:/data/db
      # Datos de ejemplo: 1000 lecturas de 10 dispositivos (solo con el volumen vacío)
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1
    container_name: mongo-express
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-secret}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-secret}@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo_data:
