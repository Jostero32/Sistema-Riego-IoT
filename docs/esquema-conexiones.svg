<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Sistema de riego IoT: conexión Arduino Mega – ESP32</title>
  <style>
    .card { fill: #ffffff; stroke: #e5e7eb; }
    .t { fill: #111827; }
    .muted { fill: #6b7280; }
    .pinlbl { fill: #e5e7eb; font-size: 12px; font-family: Consolas, Menlo, monospace; }
    .pinused { fill: #facc15; font-weight: 700; }
    .tx { stroke: #2563eb; stroke-width: 2.5; fill: none; }
    .rx { stroke: #ea580c; stroke-width: 2.5; fill: none; }
    .gnd { stroke: #374151; stroke-width: 2.5; fill: none; }
    .comp { stroke: #111827; stroke-width: 2; fill: none; }
    .lbl { font-size: 13px; fill: #111827; }
    .sub { font-size: 12px; fill: #6b7280; }
    .megapin { font-size: 12px; fill: #ecfeff; font-family: Consolas, Menlo, monospace; font-weight: 700; }
  </style>

  <rect class="card" x="1" y="1" width="1038" height="638" rx="14"/>
  <text class="t" x="40" y="40" font-size="20" font-weight="700">Gateway ESP32 · conexión con el Arduino Mega</text>
  <text class="muted" x="40" y="62" font-size="13">UART a 9600 baudios (Serial1 del ESP32 ↔ Serial1 del Mega) · tierra común obligatoria</text>

  <!-- ESP32 DevKit V1 -->
  <rect x="40" y="80" width="230" height="480" rx="10" fill="#1b2533"/>
  <rect x="62" y="96" width="140" height="150" rx="4" fill="#9ca3af"/>
  <rect x="72" y="106" width="120" height="96" rx="2" fill="#6b7280"/>
  <text x="132" y="160" text-anchor="middle" font-size="12" fill="#f9fafb" font-weight="700">ESP32-WROOM-32</text>
  <path d="M74 214 h20 v-8 h12 v8 h12 v-8 h12 v8 h12 v-8 h12 v8 h20" stroke="#374151" stroke-width="2" fill="none"/>
  <rect x="125" y="548" width="60" height="26" rx="4" fill="#9ca3af"/>
  <text x="155" y="592" text-anchor="middle" class="sub">USB</text>
  <circle cx="90" cy="500" r="9" fill="#374151"/><text x="90" y="526" text-anchor="middle" font-size="10" fill="#9ca3af">EN</text>
  <circle cx="220" cy="500" r="9" fill="#facc15"/><text x="220" y="526" text-anchor="middle" font-size="10" fill="#facc15">BOOT</text>
  <circle cx="155" cy="300" r="5" fill="#3b82f6"/><text x="155" y="322" text-anchor="middle" font-size="10" fill="#9ca3af">LED GPIO2</text>

  <g>
    <text class="pinlbl" x="246" y="124" text-anchor="end">D23</text><circle cx="258" cy="120" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="152" text-anchor="end">D22</text><circle cx="258" cy="148" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="180" text-anchor="end">TX0</text><circle cx="258" cy="176" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="208" text-anchor="end">RX0</text><circle cx="258" cy="204" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="236" text-anchor="end">D21</text><circle cx="258" cy="232" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="264" text-anchor="end">D19</text><circle cx="258" cy="260" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="292" text-anchor="end">D18</text><circle cx="258" cy="288" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="320" text-anchor="end">D5</text><circle cx="258" cy="316" r="5" fill="#6b7280"/>
    <text class="pinlbl pinused" x="246" y="348" text-anchor="end">TX2·17</text><circle cx="258" cy="344" r="5" fill="#facc15"/>
    <text class="pinlbl pinused" x="246" y="376" text-anchor="end">RX2·16</text><circle cx="258" cy="372" r="5" fill="#facc15"/>
    <text class="pinlbl" x="246" y="404" text-anchor="end">D4</text><circle cx="258" cy="400" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="432" text-anchor="end">D2</text><circle cx="258" cy="428" r="5" fill="#6b7280"/>
    <text class="pinlbl" x="246" y="460" text-anchor="end">D15</text><circle cx="258" cy="456" r="5" fill="#6b7280"/>
    <text class="pinlbl pinused" x="246" y="488" text-anchor="end">GND</text><circle cx="258" cy="484" r="5" fill="#facc15"/>
    <text class="pinlbl" x="246" y="516" text-anchor="end">3V3</text><circle cx="258" cy="512" r="5" fill="#6b7280"/>
  </g>

  <!-- Arduino Mega 2560 -->
  <rect x="760" y="200" width="240" height="340" rx="10" fill="#00878F"/>
  <text x="880" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Arduino Mega 2560</text>
  <text x="880" y="256" text-anchor="middle" font-size="11" fill="#cffafe">envía tramas al ESP32</text>
  <rect x="790" y="270" width="180" height="50" rx="6" fill="#006b72"/>
  <text x="880" y="290" text-anchor="middle" font-size="11" fill="#ecfeff">mega_ejemplo: valores</text>
  <text x="880" y="306" text-anchor="middle" font-size="11" fill="#ecfeff">aleatorios o desde la PC</text>
  <circle cx="760" cy="344" r="5" fill="#facc15"/><text class="megapin" x="772" y="348">RX1 · D19</text>
  <circle cx="760" cy="372" r="5" fill="#facc15"/><text class="megapin" x="772" y="376">TX1 · D18</text>
  <circle cx="760" cy="484" r="5" fill="#facc15"/><text class="megapin" x="772" y="488">GND</text>
  <text x="880" y="520" text-anchor="middle" font-size="11" fill="#cffafe">lógica de 5 V</text>

  <!-- ESP32 TX2 → Mega RX1 (directo: 3,3 V se lee como alto en el Mega) -->
  <path class="tx" d="M263 344 H755"/>
  <text class="lbl" x="510" y="334" text-anchor="middle">ESP32 TX2 → Mega RX1 · directo</text>

  <!-- Mega TX1 → divisor 1 kΩ / 2 kΩ → ESP32 RX2 -->
  <path class="rx" d="M755 372 H664"/>
  <path class="comp" d="M664 372 l-5 -8 l-10 16 l-10 -16 l-10 16 l-10 -16 l-10 16 l-5 -8"/>
  <text class="sub" x="634" y="402" text-anchor="middle">1 kΩ</text>
  <path class="rx" d="M604 372 H263"/>
  <circle cx="520" cy="372" r="4.5" fill="#ea580c"/>
  <path class="rx" d="M520 372 V396"/>
  <path class="comp" d="M520 396 l-8 5 l16 10 l-16 10 l16 10 l-16 10 l16 10 l-8 5"/>
  <text class="sub" x="536" y="430">2 kΩ</text>
  <path class="gnd" d="M520 456 V484"/>
  <text class="lbl" x="400" y="364" text-anchor="middle">RX2 ← Mega TX1 (5 V → 3,3 V)</text>

  <!-- GND común -->
  <path class="gnd" d="M263 484 H755"/>
  <circle cx="520" cy="484" r="4.5" fill="#374151"/>
  <text class="sub" x="640" y="476" text-anchor="middle">GND común</text>

  <!-- Notas -->
  <text class="sub" x="300" y="560">• El ESP32 no admite 5 V en sus pines: el divisor deja la señal del Mega en 3,3 V.</text>
  <text class="sub" x="300" y="580">• Botón BOOT (GPIO0) presionado al encender: fuerza el portal de configuración Wi-Fi/MQTT.</text>
  <text class="sub" x="300" y="600">• LED integrado (GPIO2): fijo = MQTT conectado · lento = sin MQTT · medio = sin Wi-Fi · rápido = modo AP.</text>
</svg>
